name: Reusable NuGet Publish Workflow

on:
  workflow_call:
    inputs:
      project_path:
        required: true
        type: string
        description: 'Path to the .csproj to pack'
      dotnet_version:
        required: false
        type: string
        default: |
          8.0.x
          10.0.x
        description: '.NET SDK version(s)'
    secrets:
      NUGET_API_KEY:
        required: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace }}/nuget

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Pack
        run: dotnet pack ${{ inputs.project_path }} -c Release -o ${{ env.NuGetDirectory }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ env.NuGetDirectory }}/*.nupkg
            ${{ env.NuGetDirectory }}/*.snupkg

  publish:
    needs: [pack]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Pushes the .snupkg alongside. --skip-duplicate makes a merge without a version bump a no-op instead of a failure.
      - name: Push to NuGet
        run: >-
          dotnet nuget push "${{ env.NuGetDirectory }}/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
