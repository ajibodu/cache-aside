name: Publish CacheAside

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/CacheAside/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/pr-checker.yml

  publish-nuget:
    needs: [test]
    uses: ./.github/workflows/publish-nuget.yml
    permissions:
      contents: read
      id-token: write # the called workflow can only get permissions the caller grants
    with:
      project_path: "src/CacheAside/CacheAside.csproj"
      nuget_user: "AjiboduEmmanuel"
